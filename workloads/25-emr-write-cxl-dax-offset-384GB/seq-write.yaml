seq-write:
  matrix:
    number_threads: [ 1, 2, 4, 8, 16, 32, 64, 128, 256 ]
  args:
    numa_task_nodes: [ 0 ]
    exec_mode: "sequential"
    operation: "write"
    device_path: "/dev/dax0.0"
    cache_instruction: none
    access_size: 64
    memory_region_size: 16G
    min_io_batch_size: 2M
    run_time: 10
    generate_read_data: false
    region_offset: 384G
